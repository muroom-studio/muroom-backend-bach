spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 60000

  sql:
    init:
      mode: never

  #  data:
  #    redis:
  #      host: localhost
  #      port: 6379

  jpa:
    open-in-view: false
    hibernate:
      # ddl-auto: update
      ddl-auto: create-drop
    properties:
      hibernate:
        #show-sql: true
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: ${AWS_S3_BUCKET}
      presign:
        expiration: 10m
    stack:
      auto: false

jwt:
  secret-key: ${JWT_SECRET_KEY}

logging:
  level:
    org.springframework: INFO
    com.moty.solarserver: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true