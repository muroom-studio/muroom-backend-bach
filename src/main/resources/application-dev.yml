spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 60000

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true


  jpa:
    open-in-view: false
    hibernate:
      # ddl-auto: update
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        #show-sql: true
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

cloud:
  aws:
    region:
      static: ${AWS_REGION}
    secretsmanager:
      enabled: true
    credentials:
      instance-profile: true
    stack:
      auto: false
    s3:
      private-bucket-name: ${AWS_S3_PRIVATE_BUCKET}
      public-bucket-name: ${AWS_S3_PUBLIC_BUCKET}
      presign:
        expiration: 10m

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-expiration-ms: 900000 #15분
  refresh-expiration-ms: 3600000 # 1시간
  signup-expiration-ms: 900000


logging:
  level:
    org.springframework: INFO
    kr.muroom.muroombackendbach: DEBUG

server:
  forward-headers-strategy: native
  url: https://dev-api.muroom.kr
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

oauth2:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}


ncp:
  sens:
    access-key: ${NAVER_ACCESS_KEY_ID}
    secret-key: ${NAVER_SECRET_KEY}
    service-id: ${NAVER_SENS_SERVICE_ID}
    from: ${NAVER_SENS_FROM}

