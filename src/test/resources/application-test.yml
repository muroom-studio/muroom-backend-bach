spring:
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      # ddl-auto: update
      ddl-auto: create-drop
    properties:
      hibernate:
        #show-sql: true
        format_sql: true
  flyway:
    enabled: false

cloud:
  aws:
    region:
      static: test-region
    s3:
      bucket: test-bucket
      presign:
        expiration: 10m
    stack:
      auto: false

jwt:
  secret-key: some-very-very-very-very-very-very-very-long-secret-key
  expiration-ms: 900000 #15분

logging:
  level:
    org.springframework: INFO
    kr.muroom.muroombackendbach: DEBUG

seoul:
  api:
    key: test-seoul-api-key

juso:
  api:
    search-key: test-juso-search-api-key
    coord-key: test-juso-coord-api-key

kakao:
  api:
    rest-api-key: test-kakao-rest-api-key

server:
  url: http://localhost:8080
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false


oauth2:
  kakao:
    client-id: test-kakao-client-id
    client-secret: test-kakao-client-secret
  google:
    client-id: test-google-client-id
    client-secret: test-google-client-secret